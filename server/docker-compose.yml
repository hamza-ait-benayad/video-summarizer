services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vidmind-postgres
    environment:
      POSTGRES_USER: vidmind
      POSTGRES_PASSWORD: vidmind
      POSTGRES_DB: vidmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: